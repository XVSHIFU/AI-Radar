[project]
name = "ai-radar-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "apscheduler>=3.11,<4",
  "asyncpg>=0.30,<1",
  "feedparser>=6.0,<7",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "tzdata>=2026.1",
  "uvicorn[standard]>=0.35,<1",
  "httpcore>=1.0.9,<2",
  "httpx>=0.28,<1",
]
[project.optional-dependencies]
embedding-local = [
  "numpy>=2.3,<3",
  "onnxruntime>=1.23,<2",
  "tokenizers>=0.22,<1",
]


[project.scripts]
radar-register-sources = "radar.register_sources:main"
radar-index-embeddings = "radar.embedding_indexer:main"
[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
markers = [
  "postgres: requires an explicitly enabled disposable PostgreSQL test database",
  "embedding: requires RADAR_RUN_EMBEDDING_TESTS=1 and pinned local model",
  "performance: requires RADAR_RUN_PERFORMANCE_TESTS=1 and disposable PostgreSQL",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
